<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openlayers/3.19.1/ol.css" />
<style>
  :root{ --solar:#c98a2b; --onshore:#4a7c59; --offshore:#3f6b8c; --misc:#8a9199;
    --ink:#1a1f24; --sub:#5b636b; --muted:#889098; --panel:#fff; --line:#e2e5e8; --line2:#eceef0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; }
  #map{ width:100vw; height:100vh; min-width:100%; background:#e6ebf0; }
  /* 줌 버튼 (+/−) — 좌상단, 무채색 미니멀 */
  .ol-zoom{ position:absolute; left:12px; top:12px; display:flex; flex-direction:column; gap:2px; }
  .ol-zoom button{ width:30px; height:30px; font-size:18px; line-height:1; color:var(--sub);
    background:rgba(255,255,255,.95); border:1px solid var(--line); border-radius:6px; cursor:pointer;
    box-shadow:0 1px 4px rgba(20,25,30,.08); padding:0; }
  .ol-zoom button:hover{ background:#eef1f4; color:var(--ink); }
  .ol-scale-line{ position:absolute; left:12px; bottom:12px; background:rgba(255,255,255,.9);
    border:1px solid var(--line); border-radius:4px; padding:1px 6px; }
  .ol-scale-line-inner{ color:var(--sub); font-size:10px; border-color:var(--sub); border-top:none;
    border-left:1px solid var(--sub); border-right:1px solid var(--sub); }
  .map-legend{ position:absolute; right:12px; top:12px; background:rgba(255,255,255,.95);
    border:1px solid var(--line); border-radius:6px; padding:8px 12px; display:flex;
    flex-direction:column; gap:6px; font-size:11.5px; color:var(--sub);
    box-shadow:0 1px 8px rgba(20,25,30,.08); z-index:3; }
  .map-legend .li{ display:inline-flex; align-items:center; gap:7px; }
  .sw{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .map-popup{ position:relative; min-width:220px; max-width:260px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; box-shadow:0 6px 24px rgba(20,25,30,.16); font-size:12.5px; color:var(--ink); }
  .map-popup::after{ content:""; position:absolute; left:50%; bottom:-7px; width:12px; height:12px;
    background:var(--panel); border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    transform:translateX(-50%) rotate(45deg); }
  .pop-head{ display:flex; gap:8px; padding:11px 12px 8px; border-bottom:1px solid var(--line2); }
  .pop-title{ font-weight:700; font-size:13px; line-height:1.35; flex:1; }
  .pop-close{ border:none; background:none; color:var(--muted); font-size:16px; cursor:pointer; }
  .pop-body{ padding:8px 12px 11px; }
  .pop-row{ display:flex; justify-content:space-between; gap:10px; padding:2px 0; }
  .pop-row .k{ color:var(--muted); font-size:11.5px; }
  .pop-row .k .hint{ display:block; font-size:10px; color:#9aa3ab; line-height:1.3; }
  .sub-sec.ref{ color:#889098; }
  .pop-row .v{ text-align:right; }
  .tag{ display:inline-flex; align-items:center; gap:5px; padding:1px 7px; border-radius:20px;
    font-size:11px; font-weight:600; border:1px solid currentColor; }
  .tag .sw{ width:6px; height:6px; }
  .map-popup.wide{ min-width:300px; max-width:400px; width:min(400px, calc(100vw - 40px)); }
  .pop-scroll{ max-height:330px; overflow:auto; }
  .sub-big{ font-size:20px; font-weight:700; }
  .sub-sec{ margin-top:8px; padding-top:6px; border-top:1px solid var(--line2); font-size:11.5px; color:var(--sub); font-weight:600; }
  .sub-tbl{ width:100%; border-collapse:collapse; font-size:11.5px; margin-top:3px; }
  .sub-tbl th{ color:var(--muted); font-weight:500; text-align:right; padding:2px 3px; }
  .sub-tbl th:first-child,.sub-tbl td:first-child{ text-align:left; }
  .sub-tbl td{ text-align:right; padding:2px 3px; border-top:1px solid var(--line2); }
  .tl-tbl{ font-size:10.5px; } .tl-tbl td{ vertical-align:top; line-height:1.3; } .tl-tbl td:nth-child(2),.tl-tbl th:nth-child(2){ text-align:left; } .tl-tbl small{ color:var(--muted); } .tl-tbl td:not(:first-child),.tl-tbl th{ white-space:nowrap; }
  .neg{ color:#b23b3b; font-weight:600; } .pos{ color:#2e7d4f; font-weight:600; }
  .pop-note{ margin-top:8px; font-size:10.5px; color:var(--muted); line-height:1.4; }
  .nodata{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#889098; font-size:14px; text-align:center; padding:40px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="map-legend" id="legend"></div>
<div class="map-popup" id="popup" hidden></div>

<!-- VWorld JS 지도라이브러리(vworldMapInit/2DMapClassInit)는 https·srcdoc 환경에서
     document.write·OSM 폴백 문제가 있어 쓰지 않는다. 대신 순수 OpenLayers 로 지도를
     만들고 VWorld WMTS 타일(위성/일반/지명)을 직접 붙인다. 키 인증은 타일 요청 시
     도메인(Referer)으로 확인된다. -->
<script>
const PLANTS = __PLANTS_JSON__;
// 변전소(한전ON 공개 계통정보). { collected, substations:[...] }
const SUBST_DATA = __SUBST_JSON__;
const SUBST = (SUBST_DATA && SUBST_DATA.substations) || [];
const VWORLD_KEY = "__VWORLD_KEY__";
const BASEMAP = "__BASEMAP__";
const COLORS = {태양광:"#c98a2b","육상풍력":"#4a7c59","해상풍력":"#3f6b8c","풍력_구분미상":"#8a9199","복합_검수필요":"#8a9199"};
const SRC_ORDER = ["태양광","육상풍력","해상풍력","풍력_구분미상","복합_검수필요"];
const WGS84="EPSG:4326";
let olMap=null, src=null, overlay=null, proj=null;
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function fmtMW(v){return v==null?"—":Number(v).toLocaleString()+"&nbsp;MW";}
function tag(s){const c=COLORS[s]||"#8a9199";return `<span class="tag" style="color:${c}"><span class="sw" style="background:${c}"></span>${esc(s)}</span>`;}

function renderLegend(){
  const present=SRC_ORDER.filter(s=>PLANTS.some(p=>p.src===s));
  document.getElementById("legend").innerHTML=present.map(s=>
    `<span class="li"><span class="sw" style="background:${COLORS[s]}"></span>${esc(s.replace("_구분미상","(미상)"))}</span>`).join("")+
    (SUBST.some(s=>s.lat!=null)?`<span class="li">⚡ 변전소: <b style="color:#1f9d55">여유</b>·<b style="color:#e03131">없음</b>·<b style="color:#7a838c">건설/계획</b> · 배지 154/345kV(345는 큰 핀)</span>`:"");
}
function iconStyle(color){return new ol.style.Style({image:new ol.style.Circle({
  radius:6, fill:new ol.style.Fill({color}), stroke:new ol.style.Stroke({color:"#fff",width:2})})});}

// 변전소 전체 여유(MW) = 접속기준용량 - 접수기준접속용량 (음수면 0, 초과분 별도 표시)
function substFree(s){ const d=s.dist; if(!d||d.capa_kw==null||d.recv_kw==null) return null; return (d.capa_kw-d.recv_kw)/1000; }
// 변전소 핀(번개 아이콘). 색: 초록=여유 있음, 빨강=여유 없음, 회색=한전ON 자료 없음(건설·계획 중).
// 154kV=보통 핀 + '154' 흰 배지, 345kV=큰 핀·남색 테두리 + '345' 남색 배지. 위치 미확정은 점선 테두리.
function substColor(s){
  const f=substFree(s);
  if(f!=null) return f>0?"#1f9d55":"#e03131";
  // 배전 자료 없는 운영 변전소(345kV 송전용 등)는 154kV 송전망 여유로 판정
  const ty=(s.trans154||{}).yearly||[];
  if(s.status==="운영"&&ty.length) return ty.some(y=>y.mw>0)?"#1f9d55":"#e03131";
  return "#7a838c";
}
function substPinSvg(color, kv345, dashed){
  const W=kv345?54:36, H=kv345?64:44, sc=kv345?1.45:1, rim=kv345?"#1c2b6b":"#ffffff", rw=kv345?3:2.5;
  const badgeFill=kv345?"#1c2b6b":"#ffffff", badgeText=kv345?"#ffffff":color, label=kv345?"345":"154";
  const dash=dashed?` stroke-dasharray="4 3"`:"";
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`+
    `<g transform="translate(${(W-28*sc)/2},${H-38*sc}) scale(${sc})">`+
    `<path d="M14 37 C14 37 2 23 2 14 A12 12 0 0 1 26 14 C26 23 14 37 14 37 Z" fill="${color}" stroke="${rim}" stroke-width="${rw/sc}"${dash}/>`+
    `<circle cx="14" cy="14" r="8.5" fill="#ffffff"/>`+
    `<path d="M15.5 7.5 L10 15 H13.6 L12.5 20.5 L18 13 H14.4 Z" fill="${color}"/></g>`+
    `<rect x="${W-(kv345?27:21)}" y="0.75" width="${kv345?26:20}" height="${kv345?13:11}" rx="${kv345?6.5:5.5}" fill="${badgeFill}" stroke="${kv345?"#ffffff":color}" stroke-width="1.2"/>`+
    `<text x="${W-(kv345?14:11)}" y="${kv345?10.6:9.3}" font-family="sans-serif" font-size="${kv345?10:8.5}" font-weight="700" text-anchor="middle" fill="${badgeText}">${label}</text></svg>`;
}
function substStyle(s){
  const color=substColor(s), kv345=s.kv==="345kV", W=kv345?54:36, H=kv345?64:44;
  const sched=s.status!=="운영"?" · "+(s.plan&&s.plan.가압?s.plan.가압+" 가압":s.status):"";
  return new ol.style.Style({
    zIndex:1000,
    image:new ol.style.Icon({src:"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(substPinSvg(color,kv345,s.approx)),
      imgSize:[W,H], anchor:[0.5,1], anchorXUnits:"fraction", anchorYUnits:"fraction"}),
    text:new ol.style.Text({text:s.name+sched+(s.approx?" · 위치 미확정":""), textAlign:"left",
      offsetX:kv345?17:13, offsetY:-(H/2),
      font:`700 ${kv345?13:12}px sans-serif`, fill:new ol.style.Fill({color:color==="#7a838c"?"#3d454d":color}),
      stroke:new ol.style.Stroke({color:"#fff",width:3.5})})});
}
function mw(kw){ return kw==null?"—":(kw/1000).toFixed(1); }
function showSubstPopup(s){
  const el=document.getElementById("popup"); el.classList.add("wide");
  // hint: 항목 설명(작은 글씨). 발전 접속 판단은 송전망·변전소·주변압기·선로 모두 여유가 있어야 함
  const row=(k,v,hint)=>`<div class="pop-row"><span class="k">${k}${hint?`<small class="hint">${hint}</small>`:""}</span><span class="v">${v}</span></div>`;
  const d=s.dist, free=substFree(s);
  let h=`<div class="pop-head"><div class="pop-title">${esc(s.name)}${/S\/S/.test(s.name)?"":" 변전소"}${s.status!=="운영"?` <span style="color:#889098;font-weight:500">(${esc(s.status)})</span>`:""}</div>`+
    `<button class="pop-close" onclick="hidePopup()">&times;</button></div><div class="pop-body pop-scroll">`;
  h+=`<div class="sub-sec">재생에너지 접속(발전)</div>`;
  if(d){
    const over=free<0?-free:0;
    h+=row("변전소 전체 여유",`<span class="sub-big ${free>0?"pos":"neg"}">${Math.max(0,free).toFixed(1)}&nbsp;MW</span>`,"접속기준 − 접수기준")+
      row("접속기준용량",mw(d.capa_kw)+"&nbsp;MW","이 변전소에 연결할 수 있는 한도(주변압기 기준)")+
      row("접수기준 접속용량",mw(d.recv_kw)+"&nbsp;MW","이미 연결된 것 + 한전에 접속 신청 접수된 것")+
      row("접속계획 반영 접속용량",mw(d.plan_kw)+"&nbsp;MW","접수분 중 연결 계획이 잡힌 용량")+
      (over>0?row("초과",`<span class="neg">${over.toFixed(1)}&nbsp;MW</span>`,"한도보다 많이 접수된 대기 물량"):"");
  } else h+=row("배전 접속 정보", s.status==="운영"?"배전 미담당(송전용 변전소)":"한전ON 미제공(건설·계획 중)");
  if(s.kv) h+=row("전압",esc(s.kv));
  if(s.approx) h+=row("위치",`<span class="neg">부지 지번 미공개 · 면 단위 대표위치</span>`);
  const t=s.trans154||{}, ty=(t.yearly||[]);
  if(ty.length){
    const anyFree=ty.some(y=>y.mw>0);
    h+=`<div class="sub-sec">송전망 접속 여유(154kV, MW)</div>`+
      (anyFree? `<table class="sub-tbl"><tr>${ty.map(y=>`<th>${y.year}</th>`).join("")}</tr><tr>${ty.map(y=>`<td>${y.mw==null?"—":y.mw}</td>`).join("")}</tr></table>`
              : row("송전망 여유",`<span class="neg">${ty[0].year}~${ty[ty.length-1].year} 여유 없음</span>`,"변전소 위 상위 송전망 — 0이면 접속 불가"))+
      (t.permit_req_mw!=null?row("발전허가 신청용량",t.permit_req_mw+"&nbsp;MW","이 송전망으로 신청된 발전허가 용량"):"");
  }
  const tl=s.tlines||[];
  if(tl.length){
    // 연결 송전선로(신설·보강) — 규격은 한전 공개, 참고 정격은 2차 자료(회선당 열적 한계)
    const cap=l=>l.ref_mva==null?`<span style="color:#9aa3ab">미확인</span>`:`${l.ref_mva}`;
    h+=`<div class="sub-sec">연결 송전선로 (신설·보강, 한전 공개)</div>`+
      `<table class="sub-tbl tl-tbl"><tr><th>선로</th><th>규격</th><th>회선</th><th>준공</th><th>참고 정격<br>MVA/회선</th></tr>`+
      tl.map(l=>`<tr><td>${esc(l.name)}${l.kv&&l.kv!==s.kv?`<br><small>${esc(l.kv)}</small>`:""}</td>`+
        `<td>${esc(l.spec)}${l.bundle?`<br><b>${esc(l.bundle)}</b>`:""}</td>`+
        `<td>${l.circuits}회선<br><small>${l.km}km</small></td><td>${esc((l.done||"").replace(/^20/,"'"))}</td><td>${cap(l)}</td></tr>`).join("")+`</table>`+
      `<div class="pop-note" style="margin-top:2px">참고 정격: 선종별 일반 정격용량(2차 자료, 한전 원문 미확인)의 회선당 열적 한계입니다. `+
      `<b>접속 가능 용량이 아닙니다</b> — 한 회선 고장에도 버텨야 해 2회선도 사실상 1회선분이고, 상위 345kV망·접수 대기 물량·계통 안정도 제약은 반영되지 않습니다. `+
      `규격 '미공개'는 기존 선로 선종교체 등 규격이 공개되지 않은 사업입니다. 출처: 한전 송변전 건설 정보공개(2026-09), 제11차 장기송변전설비계획(2025.5).</div>`;
  }
  const b=s.breaker;
  if(b){
    const v=(f,t)=>`<span class="${f>0?"pos":"neg"}">${f}</span> / ${t}대`;
    h+=`<div class="sub-sec">차단기 여유 Bay</div>`+row("22.9kV",v(b.kv22_free,b.kv22_total),"배전선로를 새로 낼 수 있는 자리(여유/전체)")+
      row("154kV",v(b.kv154_free,b.kv154_total),"154kV 직접 연결 자리(여유/전체)");
  }
  if((s.lines||[]).length){
    h+=`<div class="sub-sec">배전선로 (${s.lines.length}개, MW)</div>`+
      `<div class="pop-note" style="margin-top:0">선로에 여유가 있어도 변전소·주변압기 여유가 0이면 접속할 수 없습니다.</div>`+
      `<table class="sub-tbl"><tr><th>주변압기·선로</th><th>기준</th><th>접수</th><th>여유</th></tr>`+
      s.lines.map(l=>{const f=l.dl_capa_kw!=null?(l.dl_capa_kw-l.dl_recv_kw)/1000:(l.dl_free_kw||0)/1000;
        return `<tr><td>#${esc(l.mtr)} ${esc(l.dl)}${l.source?"*":""}</td><td>${mw(l.dl_capa_kw)}</td><td>${mw(l.dl_recv_kw)}</td><td class="${f>0?"pos":"neg"}">${Math.max(0,f).toFixed(1)}</td></tr>`;}).join("")+`</table>`+
      (s.lines.some(l=>l.source)?`<div class="pop-note">* 전력데이터개방포털 분산전원연계정보로 보강한 선로(기준용량 미제공, 접수=누적 연계량)</div>`:"");
  }
  const pl=s.plan;
  if(pl){
    h+=`<div class="sub-sec">건설 계획</div>`+row("가압 예정",`<b>${esc(pl.가압)}</b>`)+row("착공",esc(pl.착공))+
      row("단계",esc(pl.단계))+row("규모",esc(pl.규모))+row("근거",esc(pl.근거));
  }
  const sp=s.supply||{}, cur=a=>(a&&a.length)?a[0]:null, s22=cur(sp.kv22), s154=cur(sp.kv154);
  if(s22||s154){
    const v=x=>x?(x.mw>0?`${x.mw}&nbsp;MW`:"없음"):"—";
    h+=`<div class="sub-sec ref">참고: 전력공급 여유(${(s22||s154).year}) · 수요 공급용</div>`+
      `<div class="pop-note" style="margin-top:0">전기를 쓰는 고객(공장 등)에게 더 공급할 수 있는 여유입니다. 발전소 접속과는 관계없습니다.</div>`+
      row("22.9kV",v(s22))+row("154kV",v(s154));
  }
  if(s.location_source) h+=`<div class="pop-note">위치: ${esc(s.location_source)}</div>`;
  h+=`<div class="pop-note">출처: 한전ON 공개 계통정보 (수집 ${esc(SUBST_DATA.collected||"")}). 접속 가능 여부를 확정하는 자료가 아닌 참고자료입니다. 발전소 접속은 송전망·변전소·주변압기·배전선로 모두 여유가 있어야 가능합니다.</div></div>`;
  el.innerHTML=h; el.hidden=false;
  overlay.setPosition(ol.proj.fromLonLat([s.lon,s.lat]));
}
function drawMarkers(){
  src.clear();
  PLANTS.forEach(p=>{
    if(p.lat==null||p.lon==null||!isFinite(p.lat)||!isFinite(p.lon)) return;
    const f=new ol.Feature({geometry:new ol.geom.Point(ol.proj.fromLonLat([p.lon,p.lat]))});
    f.setStyle(iconStyle(COLORS[p.src]||"#8a9199")); f.set("pid",p.id); src.addFeature(f);
  });
  SUBST.forEach(s=>{
    if(s.lat==null||s.lon==null) return;          // 위치 근거 없는 변전소는 찍지 않는다
    const f=new ol.Feature({geometry:new ol.geom.Point(ol.proj.fromLonLat([s.lon,s.lat]))});
    f.setStyle(substStyle(s)); f.set("sid",s.code); src.addFeature(f);
  });
}
function showPopup(p){
  const el=document.getElementById("popup"); el.classList.remove("wide");
  const row=(k,v)=>v?`<div class="pop-row"><span class="k">${k}</span><span class="v">${v}</span></div>`:"";
  el.innerHTML=`<div class="pop-head"><div class="pop-title">${esc(p.name)}</div>`+
    `<button class="pop-close" onclick="hidePopup()">&times;</button></div><div class="pop-body">`+
    `<div class="pop-row"><span class="k">발전원</span><span class="v">${tag(p.src)}</span></div>`+
    row("지역",`${esc(p.region)} ${esc(p.sgg)}`)+row("설비용량",fmtMW(p.mw))+
    row("사업주체",esc(p.operator||"—"))+row("최초허가",esc(p.firstPermit||"—"))+
    row("최근 심의",p.round?`제${esc(p.round)}차`+(p.result?` · ${esc(p.result)}`:""):"")+`</div>`;
  el.hidden=false;
  if(p.lat!=null&&isFinite(p.lat)&&overlay) overlay.setPosition(ol.proj.fromLonLat([p.lon,p.lat]));
}
function hidePopup(){const el=document.getElementById("popup"); if(el)el.hidden=true; if(overlay)overlay.setPosition(undefined);}

// VWorld WMTS 타일 레이어 (키는 URL 에, 인증은 도메인으로). Base/Satellite/Hybrid.
function vworldTile(layer, ext){
  return new ol.layer.Tile({source:new ol.source.XYZ({
    url:`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/${layer}/{z}/{y}/{x}.${ext}`,
    crossOrigin:"anonymous", attributions:'© VWorld' })});
}
function basemapLayers(type){
  if(type==="photo") return [vworldTile("Satellite","jpeg")];
  if(type==="graphic"||type==="graphic-gray") return [vworldTile("Base","png")];
  return [vworldTile("Satellite","jpeg"), vworldTile("Hybrid","png")];  // photo-hybrid 기본
}

function buildMap(){
  if(typeof ol==="undefined"){
    document.getElementById("map").innerHTML='<div class="nodata">지도 엔진(OpenLayers)을 불러오지 못했습니다.</div>';return;
  }
  proj="EPSG:3857";
  src=new ol.source.Vector();
  olMap=new ol.Map({target:"map",
    layers:[ ...basemapLayers(BASEMAP), new ol.layer.Vector({source:src,zIndex:999}) ],
    view:new ol.View({center:ol.proj.fromLonLat([126.5,34.6]), zoom:9, minZoom:6, maxZoom:19}),
    // 줌 버튼(+/−) + 축척바. 마우스 휠·더블클릭·드래그 확대축소는 기본 인터랙션.
    controls: ol.control.defaults({attribution:false, rotate:false})
      .extend([ new ol.control.ScaleLine() ]),
    interactions: ol.interaction.defaults() });
  window.__olMap=olMap;
  overlay=new ol.Overlay({element:document.getElementById("popup"),positioning:"bottom-center",stopEvent:true,offset:[0,-6],
    autoPan:true, autoPanMargin:20});
  olMap.addOverlay(overlay);
  const CENTER=ol.proj.fromLonLat([126.5,34.6]), ZOOM=9;
  function fitView(){ olMap.getView().setCenter(CENTER); olMap.getView().setZoom(ZOOM); olMap.updateSize(); }
  olMap.updateSize(); fitView();
  window.addEventListener("resize",()=>{ olMap.updateSize(); });
  olMap.on("click",evt=>{
    let hit=null; olMap.forEachFeatureAtPixel(evt.pixel,f=>{if(f.get("pid")||f.get("sid")){hit=f;return true;}});
    if(hit&&hit.get("sid")){const s=SUBST.find(x=>x.code===hit.get("sid")); if(s)showSubstPopup(s);}
    else if(hit){const p=PLANTS.find(x=>x.id===hit.get("pid")); if(p)showPopup(p);} else hidePopup();
  });
  olMap.on("pointermove",evt=>{olMap.getTargetElement().style.cursor=olMap.hasFeatureAtPixel(evt.pixel)?"pointer":"";});
  renderLegend();
  // 마커는 지도 렌더가 안정된 뒤 추가한다(렌더 전 추가 시 렌더러 공간인덱스 rbush
  // 오류). postrender 가 안 뜨는 환경이 있어 시간차 재시도로 확실히 그린다.
  let tries=0;
  (function addMarkers(){
    tries++;
    try{ olMap.updateSize(); fitView(); drawMarkers(); }
    catch(e){ if(tries<8) return setTimeout(addMarkers,400); }
    if(src.getFeatures().length===0 && tries<8) setTimeout(addMarkers,400);
  })();
  setTimeout(()=>{ try{olMap.updateSize();fitView();}catch(e){} }, 1500);
}
// 표준 OpenLayers 3.19.1(cdnjs)을 https 로 로드한다. VWorld 배포판 ol.js 는 휠 확대 코드가
// VWorld 전용 설정(map.options.basemapType, vw.ol3.ViewConfig)을 참조하도록 개조돼 있어
// 순수 OpenLayers 지도에서는 휠 확대가 동작하지 않는다(오류로 중단). VWorld JS 지도
// 라이브러리는 쓰지 않으므로 document.write·OSM 폴백 문제가 원천 발생하지 않는다.
function loadScript(src){
  return new Promise((ok,no)=>{ const s=document.createElement("script");
    s.src=src; s.async=false; s.onload=ok; s.onerror=()=>no(src);
    document.head.appendChild(s); });
}
function waitForWidth(el, minW, tries){
  return new Promise(ok=>{
    let n=0;
    (function check(){
      if(el.offsetWidth>=minW || n++>tries) return ok(el.offsetWidth);
      setTimeout(check,120);
    })();
  });
}
let _built=false;
async function bootstrap(){
  try{
    if(typeof ol==="undefined")
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/openlayers/3.19.1/ol.js");
  }catch(e){
    document.getElementById("map").innerHTML=
      '<div class="nodata">지도 엔진(OpenLayers) 로드 실패<br>('+e+')</div>'; return;
  }
  // 지도 div 너비 확보 후 초기화 (iframe 크기 확정 전 생성 시 렌더러 인덱스 오류 방지)
  await waitForWidth(document.getElementById("map"), 200, 50);
  if(!_built){ _built=true; buildMap(); }
}
window.addEventListener("load",bootstrap);
</script>
